<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>Scoped composition CSS (stage format + per-breakpoint layer geometry). csp="true"
registers it with the Content Security Policy (hash/nonce), so a policy without 'unsafe-inline'
does not block it — an inline <style> in the body would be. priority="true" is what puts it into
the <head>: without it, inline CSS is emitted before </body> and the hero paints unstyled first.</f:comment>
<f:asset.css identifier="herobuilder-{slide.scope}" csp="true" priority="true"><f:format.raw>{slide.css}</f:format.raw></f:asset.css>
<div class="herobuilder-slide {slide.scope}">
    <div class="hb-stage">
        <f:for each="{slide.layers}" as="layer">
            <f:render partial="Layer" arguments="{layer: layer}"/>
        </f:for>
    </div>
</div>
</html>
