<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>Scoped composition CSS (stage aspect-ratio + per-breakpoint layer geometry).</f:comment>
<style><f:format.raw>{slide.css}</f:format.raw></style>
<div class="herobuilder-slide {slide.scope}">
    <div class="hb-stage">
        <f:for each="{slide.layers}" as="layer">
            <f:render partial="Layer" arguments="{layer: layer}"/>
        </f:for>
    </div>
</div>
</html>
